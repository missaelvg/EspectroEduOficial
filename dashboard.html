<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - EspectroEdu</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="styles.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script> 
</head>
<body>
<header id="header">
    <div id="header-title">EspectroEdu</div>
    <nav id="navbar"></nav>
    <button id="logoutButton" onclick="logoutUser()">Cerrar Sesión</button>
</header>
<main>
    <div id="main-content">
        Cargando...
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="scripts/firebase_config.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/data_manager.js"></script>
<script src="scripts/utils.js"></script>
<script src="scripts/dashboard_views.js"></script>

<script>
    // Inicialización del Worker de PDF.js
    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    // Inicialización del Dashboard según el rol
    async function initDashboard() {
        const mainContent = document.getElementById('main-content');
        try {
            const user = await checkAuth();
            if (!user) return;

            if (user.role === 'doctor') {
                renderDoctorLayout(user);
            } else if (user.role === 'alumno') {
                renderStudentLayout(user);
            } else if (user.role === 'coordinador') {
                renderTutorLayout(user); 
            } else {
                mainContent.innerHTML = `
                    <h2>Rol no reconocido</h2>
                    <p>Tu cuenta no tiene un rol válido asignado. Por favor, contacta al administrador.</p>
                `;
            }
        } catch (error) {
            console.error("Fallo crítico en la inicialización:", error);
            mainContent.innerHTML = `
                <h2 style="color: red;">Error al Cargar la Aplicación</h2>
                <p>No se pudo conectar con los servicios. Verifica tu conexión a internet.</p>
            `;
        }
    }
    
    initDashboard();
</script>
</body>
</html>
