<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - EspectroEdu</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script> 
</head>
<body>
<header id="header">
    <div id="header-title">EspectroEdu</div>
    <nav id="navbar"></nav>
    <button id="logoutButton" onclick="logoutUser()" data-i18n="logout">Cerrar Sesión</button>
</header>
<main>
    <div id="main-content">
        <p data-i18n="loading">Cargando...</p>
    </div>
</main>

<div id="a11y-btn" onclick="toggleA11yMenu()" title="Herramientas de Accesibilidad" aria-label="Abrir opciones de accesibilidad" style="position: fixed; bottom: 20px; right: 20px; background: var(--primary-color); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 1001; box-shadow: var(--shadow-md); border: 2px solid white; transition: 0.2s;">⚙️</div>

<div id="a11y-panel" style="display:none; position: fixed; bottom: 90px; right: 20px; width: 320px; max-height: 80vh; overflow-y: auto; background: var(--card-bg); padding: 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 1000; border: 1px solid var(--border-color);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
        <span style="font-size:1.5rem;">⚙️</span>
        <h4 style="margin:0; color:var(--brand-dark);" data-i18n="a11y_title">Herramientas de Accesibilidad</h4>
    </div>
    
    <label style="display:block; margin-bottom:15px;">
        <span style="font-weight:600; display:block; margin-bottom:5px;" data-i18n="a11y_lang">🌐 Idioma</span>
        <div style="display:flex; gap:10px;">
            <button id="lang-es" class="btn btn-full active" style="margin:0; padding:8px;" onclick="setLanguage('es')">Español</button>
            <button id="lang-en" class="btn btn-secondary btn-full" style="margin:0; padding:8px;" onclick="setLanguage('en')">English</button>
        </div>
    </label>

    <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-weight:600;">
        <span data-i18n="a11y_daltonism">👁️ Modo Daltonismo</span>
        <input type="checkbox" id="daltonism-toggle" onchange="toggleDaltonism()" style="width:20px; min-height:20px; margin:0;"> 
    </label>

    <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-weight:600;">
        <span data-i18n="a11y_audio">🔊 Guía Auditiva</span>
        <input type="checkbox" id="audio-toggle" onchange="toggleAudioGuide()" style="width:20px; min-height:20px; margin:0;"> 
    </label>

    <label style="display:block; margin-bottom:15px; font-weight:600;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span data-i18n="a11y_font">Tamaño de Fuente</span>
            <span id="fs-val" style="color:var(--text-muted); font-weight:400;">16px</span>
        </div>
        <input type="range" id="fs-toggle" min="14" max="22" value="16" onchange="changeFontSize()" style="width:100%; min-height:auto; padding:0;">
    </label>

    <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-weight:600;">
        <span data-i18n="a11y_highlight">🔗 Resaltar Enlaces</span>
        <input type="checkbox" id="hl-toggle" onchange="toggleHighlightLinks()" style="width:20px; min-height:20px; margin:0;"> 
    </label>

    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-top:20px;" data-i18n="a11y_footer">Estos ajustes se guardarán para tu próxima visita.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="scripts/firebase_config.js?v=3"></script>
<script src="scripts/auth.js?v=3"></script>
<script src="scripts/data_manager.js?v=3"></script>
<script src="scripts/utils.js?v=3"></script>
<script src="scripts/accessibility.js?v=3"></script>
<script src="scripts/dashboard_views.js?v=3"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</body>
</html>
