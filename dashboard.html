<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - EspectroEdu</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<header id="headerTitle">EspectroEdu</header>
<main>
    <div style="text-align: right; margin-bottom: 20px;">
        <button onclick="logoutUser()">Cerrar Sesión</button>
    </div>
    
    <div class="card" id="profileSection"></div>
    
    <div id="roleSpecificContent" class="card">
        </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="scripts/firebase_config.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/data_manager.js"></script>
<script src="scripts/utils.js"></script>

<script>
    // Configura el worker de PDF.js
    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    async function initDashboard() {
        const user = await checkAuth();
        if (!user) return; // Redirigido a login

        document.getElementById('headerTitle').textContent = `Bienvenido, ${user.username} (${user.role === 'doctor' ? 'Doctor' : 'Alumno'})`;

        document.getElementById('profileSection').innerHTML = `
            <h3>Mi Perfil</h3>
            <p><strong>Matrícula:</strong> ${user.matricula}</p>
            <p><strong>Grupo:</strong> ${user.grupo}</p>
            <p><strong>Correo:</strong> ${user.email}</p>
        `;

        if (user.role === 'doctor') {
            loadDoctorView(user);
        } else {
            loadStudentView(user);
        }
    }
    
    initDashboard();
</script>
<script src="scripts/dashboard_views.js"></script>
</body>
</html>
