<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EspectroEdu</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script> </head>
<body>
<header>EspectroEdu: Laboratorio de Óptica</header>
<main>
    <div class="card">
        <div id="loginForm">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="loginEmail" placeholder="Correo Electrónico">
            <input type="password" id="loginPassword" placeholder="Contraseña">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <a href="#" onclick="showRecovery()" style="font-size: 0.9em; color: #16a34a;">¿Olvidaste tu contraseña?</a>
            </div>

            <button onclick="handleLogin()">ENTRAR</button>
            <p style="margin-top: 15px;">¿Nuevo usuario? <a href="#" onclick="showRegister()">Regístrate aquí</a></p>
        </div>

        <div id="registerForm" style="display:none;">
            <h3>Registro de Usuarios</h3>
            
            <label for="regRole" style="display:block; margin-bottom:5px; font-weight:bold;">Soy:</label>
            <select id="regRole" onchange="toggleGroupInput()">
                <option value="alumno">Alumno</option>
                <option value="doctor">Doctor / Docente</option>
            </select>

            <input type="text" id="regName" placeholder="Nombre Completo" required>
            <input type="text" id="regMatricula" placeholder="Matrícula / ID Empleado" required>
            
            <input type="text" id="regGroup" placeholder="Grupo" required>
            
            <input type="email" id="regEmail" placeholder="Correo Electrónico" required>
            <input type="password" id="regPassword" placeholder="Contraseña" required>
            
            <button onclick="handleRegister()">REGISTRARME</button>
            <p><a href="#" onclick="showLogin()">Volver a Iniciar Sesión</a></p>
        </div>

        <div id="recoveryForm" style="display:none;">
            <h3>Recuperar Contraseña</h3>
            <p style="font-size: 0.9em; color: #666; margin-bottom: 15px;">
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>
            <input type="email" id="recoveryEmail" placeholder="Tu Correo Electrónico">
            <button onclick="handleRecovery()">ENVIAR CORREO</button>
            <p><a href="#" onclick="showLogin()">Cancelar y volver</a></p>
        </div>

    </div>
</main>

<script src="scripts/firebase_config.js"></script> 
<script src="scripts/auth.js"></script>
<script>
    async function checkInitialAuthAndRun() {
        const user = await getCurrentUser();
        if (user) {
            window.location.href = 'dashboard.html';
        }
    }
    checkInitialAuthAndRun();

    function showRegister() {
        hideAllForms();
        document.getElementById('registerForm').style.display = 'block';
    }
    function showLogin() {
        hideAllForms();
        document.getElementById('loginForm').style.display = 'block';
    }
    function showRecovery() {
        hideAllForms();
        document.getElementById('recoveryForm').style.display = 'block';
    }
    function hideAllForms() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('recoveryForm').style.display = 'none';
    }

    function toggleGroupInput() {
        const role = document.getElementById('regRole').value;
        const groupInput = document.getElementById('regGroup');
        if (role === 'doctor') {
            groupInput.style.display = 'none';
            groupInput.value = 'N/A';
        } else {
            groupInput.style.display = 'block';
            groupInput.value = '';
        }
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!email || !password) return alert("Por favor ingresa correo y contraseña.");

        const success = await loginUser(email, password); 
        if (success) window.location.href = 'dashboard.html';
        else alert('Credenciales incorrectas o usuario no existe.');
    }

    async function handleRegister() {
        const role = document.getElementById('regRole').value;
        const name = document.getElementById('regName').value;
        const matricula = document.getElementById('regMatricula').value;
        const password = document.getElementById('regPassword').value;
        let group = document.getElementById('regGroup').value;
        const email = document.getElementById('regEmail').value;
        
        if (role === 'doctor') group = 'N/A';

        if (name && matricula && password && email && (role === 'doctor' || group)) {
            const success = await registerUser(name, matricula, password, group, email, role);
            if(success) {
                alert('Registro exitoso. Ya puedes iniciar sesión.');
                showLogin();
            }
        } else {
            alert('Por favor, rellena todos los campos.');
        }
    }

    async function handleRecovery() {
        const email = document.getElementById('recoveryEmail').value.trim();
        if (!email) return alert("Por favor ingresa tu correo.");

        const success = await resetPassword(email);
        if (success) {
            alert(`Se ha enviado un correo a ${email}. Revisa tu bandeja de entrada para restablecer tu contraseña.`);
            showLogin();
        }
    }
</script>
</body>
</html>
