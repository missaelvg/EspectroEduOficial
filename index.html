<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EspectroEdu</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>EspectroEdu: Laboratorio de Óptica</header>
<main>
    <div class="card">
        <h2>Iniciar Sesión</h2>
        <div id="loginForm">
            <input type="text" id="loginMatricula" placeholder="Matrícula (Alumno) o doc123 (Doctor)">
            <button onclick="handleLogin()">ENTRAR</button>
            <p style="margin-top: 15px;">¿Eres nuevo? <a href="#" onclick="showRegister()">Regístrate como alumno aquí</a></p>
        </div>

        <div id="registerForm" style="display:none;">
            <h3>Registro de Alumnos</h3>
            <input type="text" id="regName" placeholder="Nombre Completo" required>
            <input type="text" id="regMatricula" placeholder="Matrícula" required>
            <input type="text" id="regGroup" placeholder="Grupo" required>
            <input type="email" id="regEmail" placeholder="Correo Electrónico" required>
            <button onclick="handleRegister()">REGISTRARME</button>
            <p><a href="#" onclick="showLogin()">Volver a Iniciar Sesión</a></p>
        </div>
    </div>
</main>
<script src="scripts/auth.js"></script>
<script>
    if (getCurrentUser()) {
        window.location.href = 'dashboard.html';
    }

    function handleLogin() {
        const matricula = document.getElementById('loginMatricula').value.trim();
        if (loginUser(matricula)) {
            window.location.href = 'dashboard.html';
        } else {
            alert('Matrícula incorrecta o no registrada.');
        }
    }

    function handleRegister() {
        const name = document.getElementById('regName').value;
        const matricula = document.getElementById('regMatricula').value;
        const group = document.getElementById('regGroup').value;
        const email = document.getElementById('regEmail').value;
        if (name && matricula && group && email) {
            if(registerUser(name, matricula, group, email, 'alumno')) {
                alert('Registro exitoso. Ya puedes iniciar sesión.');
                showLogin();
            }
        } else {
            alert('Por favor, rellena todos los campos.');
        }
    }
    
    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }
    function showLogin() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    }
</script>
</body>
</html>
